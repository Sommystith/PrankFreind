<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloByNoy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: blueviolet;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .image {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100vh;
    }

    .image img {
      width: 500px;
      max-width: 90%; /* ทำให้ไม่เกินขนาดหน้าจอ */
      border-radius: 10px;
    }

    .title {
      margin-bottom: 15px;
      color: white;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 5px black;
    }

    .container-qr {
      display: none;
      text-align: center;
    }

    .password1 {
      border: 5px solid black;
      padding: 20px;
      width: 400px;
      max-width: 90%; /* ปรับขนาดอัตโนมัติเมื่อจอเล็ก */
      height: auto;
      background: white;
      border-radius: 10px;
      text-align: center;
    }

    input {
      padding: 10px;
      width: 70%;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background: black;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: darkgray;
      color: black;
    }

    /* 📱 Responsive for mobile */
    @media (max-width: 600px) {
      body {
        height: auto;
        padding: 30px 0;
      }

      .title {
        font-size: 22px;
      }

      .image img {
        width: 90%;
      }

      .password1 {
        width: 90%;
        padding: 15px;
      }

      input,
      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="password1">
    <div class="p">
      <p>pw: 5+5*5-5 (use calculator if you r dum*)</p> <br>
    </div>
    <div class="input">
      <input type="password" placeholder="Enter password...">
      <button>Enter</button>
    </div>
  </div>

  <!-- qr container part -->
  <div class="container-qr">
    <div class="image">
      <div class="title">Scan me</div>
      <img src="WhatsApp Image 2025-11-05 at 21.53.23_c542e23f.jpg" alt="QR Code">
    </div>
  </div>

  <script>
    const button = document.querySelector("button");
    const input = document.querySelector("input");
    const password1 = document.querySelector(".password1");
    const containerQr = document.querySelector(".container-qr");

    button.addEventListener("click", () => {
      const password = input.value;
      if (password === "25") {
        password1.style.display = "none";
        containerQr.style.display = "block";
      } else {
        alert("Wrong Password!");
      }
    });
  </script>
</body>

</html>
